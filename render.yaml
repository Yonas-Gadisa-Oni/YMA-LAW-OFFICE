services:
  - type: web
    name: yma-law-office
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: BLOG_ADMIN_EMAIL
        value: ymalawoffice@blog.com

      - key: BLOG_ADMIN_PASSWORD
        sync: false