
services:
  - type: web
    name: yma-law-office
    runtime: node
    plan: starter
    region: frankfurt

    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    disk:
      name: yma-law-office-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      - key: BLOG_DATA_DIR
        value: /var/data

      - key: BLOG_ADMIN_EMAIL
        value: ymalawoffice@blog.com

      - key: BLOG_ADMIN_PASSWORD
        sync: false
